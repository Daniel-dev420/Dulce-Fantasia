<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="../CSS/REGISTRARSE.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Matangi:wght@300..900&family=Michroma&display=swap" rel="stylesheet">
</head>
<body>
    <div id="contenedor">
        <div id="contenido">
            <h1>Regístrate en Dulce fantasía</h1>
            <form action="../PHP/procesar_registro.php" method="POST">
                
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>

                <label for="usuario">Nombre de usuario:</label>
                <input type="text" id="usuario" name="usuario" required>

                <label for="contraseña">Contraseña:</label>
                <input type="password" id="contraseña" name="contraseña" required>

                <!-- Checkbox de Términos -->
                <div class="terminos">
                    <label>
                        <input type="checkbox" name="terminos" required>
                        Acepto los <a href="../PAGINAS/terminos.html" target="_blank">Términos y Condiciones</a>
                    </label>
                </div>

                <div class="botones-superior">
                    <input type="submit" value="Registrarse">
                    <input type="reset" value="Borrar">
                </div>

                <a href="../index.html" class="btn-volver">Volver</a>
                
            </form>
        </div>
    </div>
</body>
</html>

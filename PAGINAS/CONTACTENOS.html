<form id="formContacto" method="post" action="../PHP/php.php">

    <label>Nombre Completo</label>
    <input type="text" name="Nombre" required>

    <label>Correo Electrónico</label>
    <input type="email" name="Email" required>

    <label>Teléfono</label>
    <input type="tel" name="Telefono" required>

    <label>Mensaje</label>
    <textarea name="Mensaje" rows="5" required></textarea>

    <input type="submit" value="Enviar Mensaje">
    <input type="reset" value="Borrar Datos">

</form>

<div id="mensajeContacto"></div>



  <!-- FOOTER -->
  <footer>

  </footer>

  <script>
document.getElementById("formContacto").addEventListener("submit", async function(e) {

    e.preventDefault();

    const formulario = this;
    const mensaje = document.getElementById("mensajeContacto");

    const datos = new FormData(formulario);

    try {

        const respuesta = await fetch("../PHP/php.php", {
            method: "POST",
            body: datos
        });

        const resultado = await respuesta.json();

        mensaje.textContent = resultado.message;

        if (resultado.success) {
            mensaje.className = "mensaje-exito";
            formulario.reset();
        } else {
            mensaje.className = "mensaje-error";
        }

    } catch (error) {

        mensaje.textContent = "Ocurrió un error al enviar el mensaje.";
        mensaje.className = "mensaje-error";

    }

});
</script>
